[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "syntra-build"
version = "0.1.0"
description = "AI-assisted software-delivery orchestration"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = ["fpdf2==2.8.8"]

[project.optional-dependencies]
dev = [
    "mypy>=1.18,<2",
    "pytest>=8.4,<10",
    "ruff>=0.13,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]
